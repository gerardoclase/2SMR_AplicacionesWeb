<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
   <h1>Formulario</h1>
    <a href="index.html">Volver a pagina principal</a>
    <form action="datos.php" method="post">

        <fieldset>

            <legend> Datos personales</legend>
            <label for="Nombre">Nombre</label>
            <input type="text" id="Nombre" name="nombre"><br>
            <label for="Apellido">Apellidos</label>
            <input type="text" id="Apellido" name="Apellido"> <br>
            <label for="Correo">Correo electronico</label>
            <input type="text" id="correo" name="correo electronico"> <br>
            <label for="Contraseña">Contraseña</label>
            <input type="password" id="contraseña" name="Contraseña"><br>
            <label for="Edad">Edad</label> 
            <input type="number" id="edad" name="Edad" value="18">

        </fieldset>

        <fieldset>

            <legend><b>Lista desplegable</b></legend>
            <select name="Lista">
                <option value="module 1">Jaén</option>
                <option value="module 2">Sevilla</option>
                <option value="module 3">Málaga</option>
            </select>

        </fieldset>

        <fieldset>

            <legend><b>Aficiones</b></legend>
            <input type="checkbox" id="elemento 1" name="Música" checked="true">
            <label for="elemento 1">Videojuegos</label> <br>
            <input type="checkbox" id="elemento 2" name="Videojuegos">
            <label for="elemento 2">Música</label><br>
            <input type="checkbox" id="elemento 3" name="Deportes">
            <label for="elemento 3">Deportes</label><br>
            <input type="checkbox" id="elemento 4" name="Cine">
            <label for="elemento 4">Cine</label>

        </fieldset>

        <fieldset>

            <legend><b>Comentario</b></legend>
            <label for="Comentario">Comentario</label><br>
            <textarea name="Comentario" id="comentario" placeholder="Escriba aqui..." rows="8" cols="25" ></textarea><br>
        
        </fieldset>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form> 
    <p><a href="index.html">Volver a página principal</a></p>
</body>
</html>
